    <div id="gallery-modal" class="modal" aria-hidden="true">
        <div class="modal-backdrop" data-close-gallery></div>
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="gallery-title">Art Gallery</h2>
                    <p id="gallery-description">Scroll the thumbnails below, then click the preview to enlarge.</p>
                </div>
                <button class="modal-close" aria-label="Close gallery">×</button>
            </div>
            <div class="gallery-preview">
                <img id="active-image" src="" alt="Selected artwork preview">
                <div id="active-caption" class="preview-caption"></div>
            </div>
            <div class="thumbnail-list" id="thumbnail-list"></div>
            <div class="modal-footer">
                <button id="view-large" class="view-large-btn">View larger</button>
            </div>
        </div>
    </div>

    <div id="preview-popup" class="preview-popup" aria-hidden="true">
        <div class="preview-backdrop" data-close-preview></div>
        <div class="preview-content">
            <button class="preview-close" aria-label="Close preview">×</button>
            <img id="preview-image" src="" alt="Enlarged artwork preview">
            <div id="preview-caption" class="preview-caption"></div>
        </div>
    </div>

    <script>
        let isEnglish = true;
        const title = document.querySelector('.title');
        const btn = document.getElementById('lang-toggle');
        const galleryModal = document.getElementById('gallery-modal');
        const previewPopup = document.getElementById('preview-popup');
        const thumbnailList = document.getElementById('thumbnail-list');
        const activeImage = document.getElementById('active-image');
        const activeCaption = document.getElementById('active-caption');
        const previewImage = document.getElementById('preview-image');
        const previewCaption = document.getElementById('preview-caption');
        const viewLargeButton = document.getElementById('view-large');
        const galleryTitle = document.getElementById('gallery-title');
        const galleryDescription = document.getElementById('gallery-description');

        const galleryMeta = {
            art: {

            },
            photos: {
                title: 'Photo Gallery',
                description: 'Browse photo thumbnails, then enlarge the selected image.'
            }
        };

                },

                    thumb: 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"%3E%3Crect width="400" height="300" fill="%233c8dc6"/%3E%3Cpath d="M 0 220 C 120 150 280 290 400 190 L 400 300 L 0 300 Z" fill="%234facc6"/%3E%3Ccircle cx="320" cy="100" r="45" fill="%23f5f1d0"/%3E%3Ctext x="50%" y="80" dominant-baseline="middle" text-anchor="middle" font-size="24" fill="%23ffffff" font-family="Arial, sans-serif"%3EBlue Horizon%3C/text%3E%3C/svg%3E',

                }
            ],

                },
                {
                    title: 'Portrait',
                    description: 'A simple portrait with warm lighting.',
                    thumb: 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"%3E%3Crect width="400" height="300" fill="%23c29f78"/%3E%3Ccircle cx="200" cy="140" r="70" fill="%23f8e0c6"/%3E%3Cpath d="M 160 215 C 180 250 220 250 240 215" stroke="%236a3b12" stroke-width="8" fill="none"/%3E%3Ctext x="50%" y="50" dominant-baseline="middle" text-anchor="middle" font-size="24" fill="%23433b29" font-family="Arial, sans-serif"%3EPortrait%3C/text%3E%3C/svg%3E',
                    large: 'data:image/svg+xml;charset=UTF-8,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750"%3E%3Crect width="1000" height="750" fill="%23c29f78"/%3E%3Ccircle cx="500" cy="350" r="190" fill="%23f8e0c6"/%3E%3Cpath d="M 380 510 C 420 600 580 600 620 510" stroke="%236a3b12" stroke-width="20" fill="none"/%3E%3Ctext x="50%" y="95" dominant-baseline="middle" text-anchor="middle" font-size="56" fill="%23433b29" font-family="Arial, sans-serif"%3EPortrait%3C/text%3E%3C/svg%3E'
                }
            ]
        };

        let activeGallery = null;
        let activeIndex = 0;

        const setActiveItem = (item, index) => {
            activeIndex = index;
            activeImage.src = item.large;
            activeImage.alt = item.title;
            activeCaption.textContent = `${item.title} — ${item.description}`;
            previewImage.src = item.large;
            previewImage.alt = item.title;
            previewCaption.textContent = item.title;

            document.querySelectorAll('.thumbnail-item').forEach((thumb, thumbIndex) => {
                thumb.classList.toggle('selected', thumbIndex === index);
            });
        };

        const buildGallery = (galleryKey) => {
            const items = galleryData[galleryKey] || [];
            thumbnailList.innerHTML = '';
            items.forEach((item, index) => {
                const thumb = document.createElement('button');
                thumb.type = 'button';
                thumb.className = 'thumbnail-item';
                thumb.innerHTML = `<img src="${item.thumb}" alt="${item.title}">`;
                thumb.addEventListener('click', () => setActiveItem(item, index));
                thumbnailList.appendChild(thumb);
            });

            if (items.length > 0) {
                setActiveItem(items[0], 0);
            }
        };

        const openGallery = (galleryKey) => {
            const meta = galleryMeta[galleryKey] || { title: 'Gallery', description: '' };
            galleryTitle.textContent = meta.title;
            galleryDescription.textContent = meta.description;

            activeGallery = galleryKey;
            galleryModal.classList.add('visible');
            galleryModal.setAttribute('aria-hidden', 'false');
            buildGallery(galleryKey);
        };

        const closeGallery = () => {
            galleryModal.classList.remove('visible');
            galleryModal.setAttribute('aria-hidden', 'true');
        };

        const openPreview = () => {
            previewPopup.classList.add('visible');
            previewPopup.setAttribute('aria-hidden', 'false');
        };

        const closePreview = () => {
            previewPopup.classList.remove('visible');
            previewPopup.setAttribute('aria-hidden', 'true');
        };

        btn.addEventListener('click', () => {
            isEnglish = !isEnglish;
            title.innerHTML = isEnglish ? "Welcome to<br>Harry's" : "Bienvenido a<br>Harry's";
            btn.textContent = isEnglish ? "ES" : "EN";
        });

        document.querySelectorAll('.svg-map a').forEach(link => {
            const galleryKey = link.dataset.gallery;
            link.addEventListener('click', (e) => {
                if (galleryKey) {
                    e.preventDefault();
                    openGallery(galleryKey);
                    return;
                }

                const href = link.getAttribute('href');
                if (href) {
                    window.location.href = href;
                }
            });
        });

        document.querySelector('.modal-close').addEventListener('click', closeGallery);
        document.querySelector('[data-close-gallery]').addEventListener('click', closeGallery);
        document.querySelector('.preview-close').addEventListener('click', closePreview);
        document.querySelector('[data-close-preview]').addEventListener('click', closePreview);
        viewLargeButton.addEventListener('click', openPreview);
        activeImage.addEventListener('click', openPreview);

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                if (previewPopup.classList.contains('visible')) {
                    closePreview();
                } else if (galleryModal.classList.contains('visible')) {
                    closeGallery();
                }
            }
        });
    </script>
