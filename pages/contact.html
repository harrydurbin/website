<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Harry</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="contact-page">
        <div class="contact-card">
            <a href="../index.html" class="back-link">← Back to home</a>
            <h1>Contact</h1>
            <p>If you'd like to get in touch, fill out the form below and your email app will open.</p>
            <form class="contact-form" action="mailto:harrydurbin@gmail.com" method="post" enctype="text/plain">
                <label for="name">Name</label>
                <input id="name" name="Name" type="text" placeholder="Your name" required>

                <label for="email">Email</label>
                <input id="email" name="Email" type="email" placeholder="you@example.com" required>

                <label for="message">Message</label>
                <textarea id="message" name="Message" rows="6" placeholder="Write your message here" required></textarea>

                <button type="submit" class="primary-btn">Send message</button>
            </form>
            <p class="contact-note">Note: replace <strong>harrydurbin@gmail.com</strong> with your real address in the form action to receive messages.</p>
        </div>
    </div>
</body>
</html>
